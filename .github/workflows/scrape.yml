name: Daily Scrape

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run scrape in dry-run mode (no DB writes)"
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write .env.local
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          SCRAPE_DRY_RUN=${{ inputs.dry_run || 'true' }}
          SCRAPE_BATCH_SIZE=3
          SCRAPE_RESULTS=5
          SCRAPE_MAX_OFFERS=30
          EOF

      - name: Run scraper
        run: node scripts/scrape.js
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_DRY_RUN: ${{ inputs.dry_run || 'true' }}

      - name: Upload scrape report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report
          path: /tmp/scrape-report.json
