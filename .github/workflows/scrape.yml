name: Daily Scrape

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC (real run, auto-publishes)
    - cron: "0 14 * * *" # second daily batch 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run scrape in dry-run mode (no DB writes). Leave unchecked for a real run."
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Write .env.local
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          MAX_QUERIES_PER_RUN=30
          MAX_PAGES_PER_RUN=120
          TAVILY_DEPTH=basic
          TAVILY_MONTHLY_BUDGET=900
          SCRAPE_RESULTS=5
          EOF

      - name: Run scraper
        run: node scripts/scrape.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          MAX_QUERIES_PER_RUN: "30"
          MAX_PAGES_PER_RUN: "120"

      - name: Upload scrape report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report
          path: /tmp/scrape-report.json
